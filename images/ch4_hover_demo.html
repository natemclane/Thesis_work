<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>CH4 Rigid Rotor (hover)</title>
<style>
  body{font-family:sans-serif;padding:2rem;text-align:center}
  .row{display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:center}
  img{max-width:100%;height:auto}
</style></head>
<body>
  <h2>CH&#8324; rotations &mdash; hover to animate</h2>
  <div class="row">
    <img class="hover-gif" src="ch4_rot_x_still.png" data-still="ch4_rot_x_still.png" data-anim="ch4_rot_x.gif" width="400" height="400" alt="CH4 rotation about x">
    <img class="hover-gif" src="ch4_rot_y_still.png" data-still="ch4_rot_y_still.png" data-anim="ch4_rot_y.gif" width="400" height="400" alt="CH4 rotation about y">
    <img class="hover-gif" src="ch4_rot_z_still.png" data-still="ch4_rot_z_still.png" data-anim="ch4_rot_z.gif" width="400" height="400" alt="CH4 rotation about z">
  </div>
  <script>
    document.querySelectorAll('.hover-gif').forEach(img => {
      new Image().src = img.dataset.anim;  // preload
      img.addEventListener('mouseenter', () => { img.src = img.dataset.anim + '?t=' + Date.now(); });
      img.addEventListener('mouseleave', () => { img.src = img.dataset.still; });
    });
  </script>
</body></html>
